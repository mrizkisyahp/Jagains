name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Start PostgreSQL container (Podman)
        run: |
          sudo systemctl stop postgresql 2>/dev/null || true
          podman run -d \
            --name postgres \
            -e POSTGRES_DB=Jagains \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            docker.io/library/postgres:16-alpine

          echo "Waiting for PostgreSQL to be ready..."
          until podman exec postgres pg_isready -U postgres -d Jagains; do
            sleep 1
          done
          echo "PostgreSQL is ready!"

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
